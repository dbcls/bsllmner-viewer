[project]
name = "bsllmner-viewer"
version = "0.1.0"
description = "Query API and build tools for ontology-mapped BioSample annotations produced by bsllmner-mk2"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.3",
  "fastapi>=0.115",
  "lark>=1.2",
  "lxml>=5.3",
  "orjson>=3.10",
  "pyarrow>=17",
  "pydantic>=2.9",
  "pyyaml>=6",
  "uvicorn[standard]>=0.30",
]

[project.scripts]
bsllmner-viewer-build = "bsllmner_viewer.build.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.27",
  "hypothesis>=6.112",
  "lxml-stubs>=0.5",
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.7",
  "types-pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bsllmner_viewer"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "PTH", "PT", "RET", "ARG", "T20", "N"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["duckdb", "duckdb.*", "lark", "lark.*", "orjson", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default of pytest without "build", because the tests of the build are in tests/unit/build and tests/pbt/build.
norecursedirs = ["*.egg", ".*", "_darcs", "CVS", "dist", "node_modules", "venv", "{arch}"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:bsllmner_viewer"]
