# Deployment: api serving one store file, and nginx serving the built frontend and proxying /api.
# Works with podman-compose and docker compose.
services:
  api:
    build:
      context: ../backend
      args:
        BSLLMNER_VIEWER_COMMIT: ${BSLLMNER_VIEWER_COMMIT:-}
    image: bsllmner-viewer-api
    volumes:
      - ${BSLLMNER_VIEWER_STORE_DIR:?set to the directory holding the store files}:/data/store:ro
      # DuckDB spills to disk when a query needs more than the memory limit. The store directory is read-only, so the
      # spill goes to a volume on disk (a tmpfs would take memory).
      - api-temp:/var/tmp/bsllmner-viewer
    environment:
      BSLLMNER_VIEWER_STORE: /data/store/${BSLLMNER_VIEWER_STORE_FILE:-current.duckdb}
      BSLLMNER_VIEWER_THREADS: ${BSLLMNER_VIEWER_THREADS:-8}
      BSLLMNER_VIEWER_TEMP_DIRECTORY: /var/tmp/bsllmner-viewer
      # An empty value selects the default of the api.
      BSLLMNER_VIEWER_MEMORY_LIMIT: ${BSLLMNER_VIEWER_MEMORY_LIMIT:-}
      BSLLMNER_VIEWER_MAX_TEMP_SIZE: ${BSLLMNER_VIEWER_MAX_TEMP_SIZE:-}
      BSLLMNER_VIEWER_QUERY_TIMEOUT: ${BSLLMNER_VIEWER_QUERY_TIMEOUT:-}
      BSLLMNER_VIEWER_MAX_QUERIES: ${BSLLMNER_VIEWER_MAX_QUERIES:-}
      BSLLMNER_VIEWER_MAX_EXPORTS: ${BSLLMNER_VIEWER_MAX_EXPORTS:-}
      BSLLMNER_VIEWER_QUEUE_TIMEOUT: ${BSLLMNER_VIEWER_QUEUE_TIMEOUT:-}
    command: >
      uv run uvicorn bsllmner_viewer.api.app:create_app --factory
      --host 0.0.0.0 --port 8000 --workers ${BSLLMNER_VIEWER_API_WORKERS:-2}
    # CMD-SHELL with one string: podman-compose 1.0.6 quotes the arguments of the CMD form wrongly.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import json, urllib.request; r = urllib.request.urlopen('http://localhost:8000/api/service-info', timeout=5); raise SystemExit(json.load(r)['store'] != 'ok')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # always, because the user's podman-restart.service starts only containers with this policy after a reboot.
    restart: always

  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile.web
      args:
        BSLLMNER_VIEWER_COMMIT: ${BSLLMNER_VIEWER_COMMIT:-}
    image: bsllmner-viewer-web
    ports:
      - "${BSLLMNER_VIEWER_PORT:-20081}:80"
    environment:
      BSLLMNER_VIEWER_NOINDEX: ${BSLLMNER_VIEWER_NOINDEX:-false}
    depends_on:
      - api
    restart: always

volumes:
  api-temp:
