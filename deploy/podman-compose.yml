# What podman-compose adds to compose.yml. podman-compose reads both files in this directory, and docker compose reads
# only compose.yml.
#
# Each container writes its output to its own file in the directory log at the root of the checkout. The containers
# do not write to the journal of the host, because the journal drops its oldest lines when the other services of the
# host write a lot. The directory must exist before the containers start. When a file reaches max-size, podman
# replaces the file with an empty file.
services:
  api:
    logging:
      driver: k8s-file
      options:
        path: ${COMPOSE_PROJECT_DIR}/../log/api.log
        max-size: 500mb

  web:
    logging:
      driver: k8s-file
      options:
        path: ${COMPOSE_PROJECT_DIR}/../log/web.log
        max-size: 500mb
