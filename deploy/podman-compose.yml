# What podman-compose adds to compose.yml. podman-compose reads both files in this directory, and docker compose reads
# only compose.yml.
#
# Each container writes its output to a file of its own in the directory log at the root of the checkout, and not to
# the journal of the host, whose oldest lines go when the other services of the host write a lot. The directory must
# exist before the containers start. Before a file grows past max-size, podman starts it again empty.
services:
  api:
    logging:
      driver: k8s-file
      options:
        path: ${COMPOSE_PROJECT_DIR}/../log/api.log
        max-size: 500mb

  web:
    logging:
      driver: k8s-file
      options:
        path: ${COMPOSE_PROJECT_DIR}/../log/web.log
        max-size: 500mb
